# Child Argo CD Application: manually sync after previous component is healthy.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istiod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://blob.istio.io/istio-release/charts
    chart: istiod
    targetRevision: 1.31.3
    helm:
      releaseName: istiod
      valuesObject:
        profile: ambient
        # 단일 노드 환경에서 HPA 비활성화
        autoscaleEnabled: false
        replicaCount: 1
        
        base:
          # Prevent validating-webhook field-manager drift in GitOps/SSA installations.
          validationFailurePolicy: Fail
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    # No 'automated' field on purpose: initial installation is manually gated.
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
