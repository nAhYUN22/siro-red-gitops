# Child Argo CD Application: manually sync after previous component is healthy.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-base
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://blob.istio.io/istio-release/charts
    chart: base
    targetRevision: 1.31.3
    helm:
      releaseName: istio-base
      valuesObject:
        defaultRevision: default
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    # No 'automated' field on purpose: initial installation is manually gated.
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
